plugins {
    id 'java'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "Mojang"
        url = "https://libraries.minecraft.net/"
    }
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar', '**/*.jar'])
    compileOnly "org.jspecify:jspecify:1.0.0"
    compileOnly "it.unimi.dsi:fastutil:8.5.15"
    implementation "com.google.code.gson:gson:2.11.0"
    implementation "com.mojang:brigadier:1.3.10"
    implementation "org.slf4j:slf4j-api:2.0.16"
    implementation "org.lwjgl:lwjgl-glfw:3.3.4"

    testImplementation fileTree(dir: 'libs', include: ['*.jar', '**/*.jar'])
    testImplementation "org.jspecify:jspecify:1.0.0"
    testImplementation "it.unimi.dsi:fastutil:8.5.15"
    testImplementation "com.mojang:datafixerupper:8.0.16"
    testImplementation "com.mojang:authlib:6.0.57"
    testImplementation "com.mojang:logging:1.2.7"
    testImplementation "io.netty:netty-codec:4.1.115.Final"
    testImplementation "org.joml:joml:1.10.8"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly fileTree(dir: 'libs', include: ['*.jar', '**/*.jar'])
    testRuntimeOnly "org.jspecify:jspecify:1.0.0"
    testRuntimeOnly "it.unimi.dsi:fastutil:8.5.15"
    testRuntimeOnly "com.mojang:datafixerupper:8.0.16"
    testRuntimeOnly "com.mojang:authlib:6.0.57"
    testRuntimeOnly "com.mojang:logging:1.2.7"
    testRuntimeOnly "io.netty:netty-codec:4.1.115.Final"
    testRuntimeOnly "org.joml:joml:1.10.8"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

jar {
    manifest {
        attributes(
            "Specification-Title": "AH Sniper Client Mod",
            "Specification-Version": project.version,
            "Implementation-Title": project.name,
            "Implementation-Version": project.version,
            "Fabric-Mapping-Namespace": "named"
        )
    }
}
